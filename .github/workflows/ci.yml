name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  # Cold source build bound; cached builds are normally seconds.
  GODOTIK_BUILD_TIMEOUT: "1500"
  # The compiler cache location is PINNED here rather than left to ccache's own
  # default, because that default moved between major versions: ccache 3.x used
  # ~/.ccache, ccache 4.x follows the XDG spec and uses ~/.cache/ccache. A cache
  # action pointed at ~/.ccache is therefore pointed at a directory a 4.x ccache
  # never creates, so the post-job save fails path validation with "Path(s)
  # specified in the action for caching do(es) not exist, hence no cache is being
  # saved", nothing is persisted, and every later run correctly reports 0 hits.
  # That is a real failure wearing the costume of a correct measurement, so the
  # path is defined once here and both the build and the cache action read it.
  #
  # The context is load-bearing and not cosmetic. This key sits at WORKFLOW
  # level, before `jobs:`, where the available contexts are `github`, `vars` and
  # `inputs` -- `runner` is NOT among them. An unresolved expression yields an
  # empty string, so `${{ runner.temp }}/x` here silently becomes `/x`, which on
  # a GitHub-hosted runner is a path a non-root user cannot create. The result is
  # the original fault reproduced exactly: the cache action points at a
  # directory that does not exist, the save fails path validation, and later runs
  # correctly report 0 hits. This workflow already uses `runner.temp`
  # successfully, but at STEP level (VERIFY_LOG_DIR), which is a different scope
  # with a different context set. `github.workspace` is available at workflow
  # level, so that is what this key uses; it is also better than a hardcoded
  # /tmp, since a self-hosted runner with a persistent /tmp would leak one job's
  # cache into the next. Because CCACHE_DIR is set only by this workflow, a local
  # run has no CCACHE_DIR at all and falls back to ccache's own default, so
  # nothing here can create a directory inside a developer's checkout.
  CCACHE_DIR: ${{ github.workspace }}/.ccache-godotik

jobs:
  gates:
    name: Headless gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout game repo
        uses: actions/checkout@v4

      # addons/* are separate repos declared in .gitmodules with SSH URLs;
      # rewrite to HTTPS so a public CI runner can fetch them.
      # INFRA GATE (not solved here, by decision): if those addon repos are
      # private, the runner needs a token/secret. Until then the gates below
      # only run where the submodules are cloneable.
      - name: Fetch addon submodules (HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - name: Resolve pinned GodotIK revisions
        id: godotik-revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "godotik=$(git -C third_party/godotik rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "godot_cpp=$(git -C third_party/godotik/godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GodotIK build
        uses: actions/cache@v4
        with:
          path: |
            third_party/godotik/.scons-cache
            third_party/godotik/.sconsign.dblite
            third_party/godotik/godot-cpp/.sconsign.dblite
            third_party/godotik/godot-cpp/bin
            third_party/godotik/godot_project/addons/libik/bin
          key: godotik-build-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ steps.godotik-revisions.outputs.godotik }}-${{ steps.godotik-revisions.outputs.godot_cpp }}

      # The GodotIK build cache above is keyed on the exact pinned commits and
      # deliberately has NO restore-keys, so a commit bump restores nothing.
      # That is correct for the .so (a stale binary must never ship) and it is
      # exactly the case a compiler cache pays off in: godot-cpp's headers
      # barely change when the extension's own sources do, so most of a cold
      # rebuild becomes ccache hits. Keyed WITHOUT the source commits on
      # purpose, with restore-keys so a pin bump still gets the compiler cache.
      # ccache invalidates on its own when the compiler changes.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          # The pinned CCACHE_DIR, not a literal: see the top-level env comment.
          # ~/.ccache is ccache 3.x's default and a 4.x ccache never creates it.
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}-x86_64-template_release
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}-x86_64-

      - name: Install GodotIK build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y scons g++ ccache
          # Keep the Actions cache bounded; 1G is ample for this one target.
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      # THROWAWAY PROBE -- NOT FOR MERGE. Removes the SCons state that
      # actions/cache just restored, forcing a cold recompile while HEAD stays on
      # the pinned commit, so build-godotik.sh's pin guard still passes. Every
      # compile is byte-identical to a previous run, so a non-trivial ccache HIT
      # count is attributable to ccache and to nothing else. This is the only way
      # to get a build-cache miss without moving HEAD: an empty commit in the
      # submodule does move the key, but it also trips the pin guard, which
      # refuses to build an unpinned tree.
      - name: PROBE invalidate restored SCons state
        run: |
          rm -rf third_party/godotik/.scons-cache \
                 third_party/godotik/.sconsign.dblite \
                 third_party/godotik/godot-cpp/.sconsign.dblite \
                 third_party/godotik/godot-cpp/bin \
                 third_party/godotik/godot_project/addons/libik/bin
          echo "probe: SCons state cleared, HEAD still $(git -C third_party/godotik rev-parse --short HEAD)"
      - name: Build and stage GodotIK
        shell: bash
        run: tools/build-godotik.sh

      - name: Reject untracked import inputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t untracked < <(git ls-files --others --exclude-standard -- assets addons src scenes project.godot)
          if ((${#untracked[@]})); then
            printf 'Untracked import inputs are forbidden in CI:\n' >&2
            printf '  %s\n' "${untracked[@]}" >&2
            exit 1
          fi

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          if [ ! -x godot ]; then
            curl -fsSL -o godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
            chmod +x godot
          fi
          echo "$HOME/godot" >> "$GITHUB_PATH"

      # Import cache: `.godot/` is generated, never committed. Version the cache
      # and key it to all import-relevant source roots so a cache from before an
      # asset/addon/project change cannot be restored as if it were current.
      - name: Cache Godot import (.godot)
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-v3-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'assets/**', 'addons/**', 'src/**', 'scenes/**', 'tools/**', 'test/**', '**/*.gd', '**/*.tscn', '**/*.tres', '**/*.import') }}

      # Single verification entry point — the SAME command a human runs.
      # Replaces the old per-harness steps AND the old import-only "parse gate"
      # (which could never fail: `godot --import` exits 0 on a broken script).
      # verify-all runs: import+check_scripts (parse), validate_assets,
      # validate_ballistics, validate_weapon_mechanics, the three
      # validate_meta_* harnesses, validate_invariants (cross-system regression
      # probes promoted from *_tmp.gd), and the qa quality audit (BLOCKER hard).
      - name: verify-all
        env:
          VERIFY_LOG_DIR: ${{ runner.temp }}/verify-all-logs
          VERIFY_LIVE_LOGS: "1"
        run: node tools/verify-all.mjs

      # Keep the complete per-gate logs available from the CI run page, even
      # when the aggregate command fails. The log directory is supplied by
      # VERIFY_LOG_DIR so the artifact path is deterministic on GitHub runners.
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-all-logs
          if-no-files-found: warn
          retention-days: 14

  export:
    name: Export binaries (needs templates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gates
    # Opt-in: set the repo variable RUN_EXPORT=true once export templates are
    # provisioned. Left off by default so a missing template cannot redden CI.
    if: ${{ vars.RUN_EXPORT == 'true' }}
    steps:
      - name: Checkout game repo
        uses: actions/checkout@v4

      # INFRA GATE (documented, not solved): same private-submodule token
      # requirement as the gates job.
      - name: Fetch addon submodules (HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - name: Resolve pinned GodotIK revisions
        id: godotik-revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "godotik=$(git -C third_party/godotik rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "godot_cpp=$(git -C third_party/godotik/godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GodotIK build
        uses: actions/cache@v4
        with:
          path: |
            third_party/godotik/.scons-cache
            third_party/godotik/.sconsign.dblite
            third_party/godotik/godot-cpp/.sconsign.dblite
            third_party/godotik/godot-cpp/bin
            third_party/godotik/godot_project/addons/libik/bin
          key: godotik-build-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ steps.godotik-revisions.outputs.godotik }}-${{ steps.godotik-revisions.outputs.godot_cpp }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          # The pinned CCACHE_DIR, not a literal: see the top-level env comment.
          # ~/.ccache is ccache 3.x's default and a 4.x ccache never creates it.
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}-x86_64-template_release
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}-x86_64-

      - name: Install GodotIK build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y scons g++ ccache
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      - name: Build and stage GodotIK
        shell: bash
        run: tools/build-godotik.sh

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/tpl && (cd /tmp/tpl && unzip -o /tmp/templates.tpz)
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Import
        run: godot --headless --path . --import

      - name: Export Linux/X11
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          godot --headless --path . --export-release "Linux/X11" "$RUNNER_TEMP/export/fps-basegame.x86_64"

      - name: Export Windows Desktop
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          godot --headless --path . --export-release "Windows Desktop" "$RUNNER_TEMP/export/fps-basegame.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fps-basegame-build
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
